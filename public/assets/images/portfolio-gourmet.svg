<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="wine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" />
  <circle cx="650" cy="150" r="180" fill="#6366f1" opacity="0.15" />
  <circle cx="150" cy="380" r="140" fill="#ec4899" opacity="0.12" />
  <!-- UI Mockup Window -->
  <rect x="120" y="80" width="560" height="340" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <!-- Window Header -->
  <rect x="120" y="80" width="560" height="40" rx="16" fill="#1e293b" />
  <circle cx="145" cy="100" r="5" fill="#ef4444" />
  <circle cx="160" cy="100" r="5" fill="#eab308" />
  <circle cx="175" cy="100" r="5" fill="#22c55e" />
  <rect x="260" y="92" width="280" height="16" rx="8" fill="#0f172a" />
  <!-- Content inside Window -->
  <rect x="150" y="150" width="220" height="24" rx="4" fill="#f8fafc" />
  <rect x="150" y="185" width="180" height="12" rx="4" fill="#94a3b8" />
  <!-- Wine Bottle Icon Visual -->
  <rect x="440" y="145" width="200" height="235" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <rect x="525" y="170" width="30" height="70" rx="6" fill="url(#wine)" />
  <rect x="532" y="155" width="16" height="20" rx="2" fill="url(#gold)" />
  <rect x="465" y="260" width="150" height="16" rx="4" fill="#f8fafc" />
  <rect x="480" y="285" width="120" height="10" rx="4" fill="#94a3b8" />
  <rect x="480" y="315" width="120" height="32" rx="8" fill="url(#wine)" />
  <!-- Badges -->
  <rect x="150" y="230" width="110" height="28" rx="14" fill="#312e81" stroke="#6366f1" stroke-width="1" />
  <text x="205" y="248" fill="#a5b4fc" font-size="11" font-family="sans-serif" text-anchor="middle">E-Commerce</text>
  <rect x="270" y="230" width="100" height="28" rx="14" fill="#831843" stroke="#f43f5e" stroke-width="1" />
  <text x="320" y="248" fill="#fbcfe8" font-size="11" font-family="sans-serif" text-anchor="middle">Idram / ArCa</text>
  <!-- Metrics Card -->
  <rect x="150" y="280" width="250" height="90" rx="10" fill="#1e293b" />
  <text x="170" y="315" fill="#38bdf8" font-size="28" font-family="sans-serif" font-weight="bold">+145%</text>
  <text x="170" y="340" fill="#94a3b8" font-size="12" font-family="sans-serif">Առցանց վաճառքների աճ</text>
</svg>
