<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_med" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#134e4a" />
    </linearGradient>
    <linearGradient id="teal_accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg_med)" />
  <circle cx="680" cy="380" r="160" fill="#0d9488" opacity="0.15" />
  <circle cx="150" cy="120" r="140" fill="#0284c7" opacity="0.12" />

  <!-- App Window -->
  <rect x="120" y="80" width="560" height="340" rx="16" fill="#0b1320" stroke="#134e4a" stroke-width="2" />
  <rect x="120" y="80" width="560" height="40" rx="16" fill="#111e33" />
  <circle cx="145" cy="100" r="5" fill="#ef4444" />
  <circle cx="160" cy="100" r="5" fill="#eab308" />
  <circle cx="175" cy="100" r="5" fill="#22c55e" />

  <!-- Cross icon -->
  <circle cx="175" cy="170" r="25" fill="url(#teal_accent)" />
  <path d="M 175 158 L 175 182 M 163 170 L 187 170" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

  <text x="220" y="168" fill="#f8fafc" font-size="20" font-family="sans-serif" font-weight="bold">MedCare Diagnostics</text>
  <text x="220" y="188" fill="#5eead4" font-size="12" font-family="sans-serif">Օնլայն Ամրագրման Համակարգ</text>

  <!-- Doctor Card 1 -->
  <rect x="150" y="225" width="230" height="75" rx="10" fill="#111e33" stroke="#1e293b" stroke-width="1" />
  <circle cx="185" cy="262" r="18" fill="#334155" />
  <text x="215" y="255" fill="#f1f5f9" font-size="13" font-family="sans-serif" font-weight="bold">Բժ. Կարեն Հովհաննիսյան</text>
  <text x="215" y="275" fill="#94a3b8" font-size="11" font-family="sans-serif">Սրտաբան • 14:00 Ազատ է</text>

  <!-- Doctor Card 2 -->
  <rect x="150" y="315" width="230" height="75" rx="10" fill="#111e33" stroke="#1e293b" stroke-width="1" />
  <circle cx="185" cy="352" r="18" fill="#334155" />
  <text x="215" y="345" fill="#f1f5f9" font-size="13" font-family="sans-serif" font-weight="bold">Բժ. Աննա Գևորգյան</text>
  <text x="215" y="365" fill="#94a3b8" font-size="11" font-family="sans-serif">Նյարդաբան • 16:30 Ազատ է</text>

  <!-- Booking Step UI -->
  <rect x="410" y="225" width="235" height="165" rx="12" fill="#0d1b2a" stroke="#14b8a6" stroke-width="1" />
  <text x="430" y="255" fill="#14b8a6" font-size="14" font-family="sans-serif" font-weight="bold">Ամրագրել Այցելություն</text>
  <rect x="430" y="275" width="195" height="30" rx="6" fill="#1e293b" />
  <text x="440" y="295" fill="#94a3b8" font-size="11" font-family="sans-serif">Օրացույց: Սեպտեմբեր 18</text>
  <rect x="430" y="315" width="195" height="30" rx="6" fill="#1e293b" />
  <text x="440" y="335" fill="#94a3b8" font-size="11" font-family="sans-serif">Ժամ: 14:00</text>
  <rect x="430" y="355" width="195" height="25" rx="6" fill="url(#teal_accent)" />
  <text x="527" y="372" fill="#042f2e" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Հաստատել (SMS OTP)</text>
</svg>
