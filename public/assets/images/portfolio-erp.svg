<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_erp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cyan_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg_erp)" />
  <circle cx="680" cy="120" r="160" fill="#0ea5e9" opacity="0.1" />
  <circle cx="120" cy="400" r="140" fill="#6366f1" opacity="0.1" />
  <!-- ERP Dashboard Window -->
  <rect x="100" y="70" width="600" height="360" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="2" />
  <!-- Top Bar -->
  <rect x="100" y="70" width="600" height="42" rx="14" fill="#111827" />
  <circle cx="125" cy="91" r="5" fill="#ef4444" />
  <circle cx="140" cy="91" r="5" fill="#eab308" />
  <circle cx="155" cy="91" r="5" fill="#22c55e" />
  <!-- Sidebar -->
  <rect x="100" y="112" width="130" height="318" fill="#0d131f" />
  <rect x="120" y="130" width="90" height="12" rx="4" fill="#06b6d4" />
  <rect x="120" y="160" width="70" height="10" rx="3" fill="#334155" />
  <rect x="120" y="185" width="80" height="10" rx="3" fill="#334155" />
  <rect x="120" y="210" width="65" height="10" rx="3" fill="#334155" />
  <rect x="120" y="235" width="75" height="10" rx="3" fill="#334155" />
  <!-- Main ERP Content -->
  <!-- Stat Cards -->
  <rect x="250" y="130" width="130" height="70" rx="8" fill="#1e293b" />
  <text x="265" y="160" fill="#06b6d4" font-size="20" font-family="sans-serif" font-weight="bold">50,000+</text>
  <text x="265" y="180" fill="#94a3b8" font-size="10" font-family="sans-serif">Ապրանքներ</text>

  <rect x="395" y="130" width="130" height="70" rx="8" fill="#1e293b" />
  <text x="410" y="160" fill="#10b981" font-size="20" font-family="sans-serif" font-weight="bold">3 Պահեստ</text>
  <text x="410" y="180" fill="#94a3b8" font-size="10" font-family="sans-serif">Միասնական համակարգ</text>

  <rect x="540" y="130" width="130" height="70" rx="8" fill="#1e293b" />
  <text x="555" y="160" fill="#f59e0b" font-size="20" font-family="sans-serif" font-weight="bold">12 Կետ</text>
  <text x="555" y="180" fill="#94a3b8" font-size="10" font-family="sans-serif">Վաճառքի սինխրոնիզացիա</text>

  <!-- Bar Chart Simulation -->
  <rect x="250" y="220" width="420" height="180" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1" />
  <text x="270" y="250" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="bold">Իրական ժամանակում շրջանառություն & Պահեստ</text>
  <!-- Bars -->
  <rect x="280" y="320" width="28" height="60" rx="4" fill="url(#cyan_grad)" />
  <rect x="330" y="290" width="28" height="90" rx="4" fill="url(#cyan_grad)" />
  <rect x="380" y="270" width="28" height="110" rx="4" fill="url(#cyan_grad)" />
  <rect x="430" y="300" width="28" height="80" rx="4" fill="url(#cyan_grad)" />
  <rect x="480" y="260" width="28" height="120" rx="4" fill="url(#cyan_grad)" />
  <rect x="530" y="280" width="28" height="100" rx="4" fill="url(#cyan_grad)" />
  <rect x="580" y="240" width="28" height="140" rx="4" fill="#38bdf8" />
</svg>
